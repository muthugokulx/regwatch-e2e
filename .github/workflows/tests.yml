name: RegWatch E2E tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 20 * * *"   # nightly regression, 2:00 AM IST
  workflow_dispatch:         # "Run workflow" button in the Actions tab

jobs:
  # ------------------------------------------------------------ Job 1: fast feedback
  tests:
    name: UI + API + DB tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Seed clean test data
        run: python scripts/seed_data.py --clean

      - name: Start the app
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done

      - name: Run all tests
        run: >
          pytest -v
          --junitxml=test-results/results.xml
          --screenshot=only-on-failure
          --tracing=retain-on-failure
          --output=test-results

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  # ------------------------------------------------------------ Job 2: same tests against the Docker container
  docker-tests:
    name: Tests against Docker container
    runs-on: ubuntu-latest
    needs: tests   # only runs if Job 1 passed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Build and start the app container
        run: docker compose up -d --build --wait

      - name: Seed clean data inside the container
        run: |
          docker compose exec -T app python scripts/seed_data.py --clean
          sudo chmod -R a+rw data

      - name: Run all tests against the container
        env:
          DB_PATH: data/regwatch.db
        run: pytest -v

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop container
        if: always()
        run: docker compose down
