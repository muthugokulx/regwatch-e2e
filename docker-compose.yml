# Runs the app container with its database stored in ./data on the host
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/regwatch.db
      API_KEY: dev-key
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
